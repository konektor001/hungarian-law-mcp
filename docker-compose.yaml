services:
  mcp-server:
    build: .
    image: ansvar-mcp
    container_name: magyar-jogszabaly-mcp
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENABLE_BACKGROUND_SYNC=true
    ports:
      - "3000:3000"
    networks:
      - dify_default

networks:
  dify_default:
    external: true
